name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Allow manual triggers

env:
  MLFLOW_TRACKING_URI: file:./mlruns
  MLFLOW_ALLOW_FILE_STORE: "true"
  PYTHON_VERSION: "3.10"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ml

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: ml/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate synthetic data
      run: python generate_data.py

    - name: Train model
      run: python train.py

    - name: Evaluate model
      run: python evaluate.py

    - name: Run unit & API tests
      run: python test_ml.py

    - name: Run drift detection
      run: python monitor.py
      continue-on-error: true  # Don't fail build on drift, just report

    - name: Build Docker image
      run: docker build -t voyage-ai-mlops:${{ github.sha }} .

    - name: Test Docker image
      run: |
        docker run -d --name ml-test -p 8000:8000 voyage-ai-mlops:${{ github.sha }}
        sleep 10
        curl -f http://localhost:8000/health
        curl -X POST http://localhost:8000/predict \
          -H "Content-Type: application/json" \
          -d '{"source":"Delhi","destination":"Mumbai","distance_km":1150,"days_to_departure":30,"day_of_week":2,"month":10,"is_weekend":0,"demand_index":1.0,"travel_class":"Economy","stops":0,"departure_time_category":"Morning","duration_hours":2.5}'
        docker stop ml-test && docker rm ml-test

    - name: Upload model artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ml-model-${{ github.sha }}
        path: |
          ml/models/*.pkl
          ml/models/*_metadata.json
          ml/metrics/*.json
          ml/mlruns/
        retention-days: 30

  # Separate job for retraining evaluation (can be triggered manually or on schedule)
  retrain-evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ml
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: ml/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download model artifacts
      uses: actions/download-artifact@v4
      with:
        name: ml-model-${{ github.sha }}
        path: ml/

    - name: Run retraining evaluation
      run: python retrain.py
      continue-on-error: true

    - name: Upload retraining result
      uses: actions/upload-artifact@v4
      with:
        name: retrain-result-${{ github.sha }}
        path: ml/logs/retrain_result.json
        retention-days: 30

  # Frontend tests (if needed)
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Build Next.js application
      run: npm run build